    <text x="90" y="548" font-size="28" fill="#e2e8f0" font-family="Menlo, monospace">npm i @xioflow/kernel</text>
    <text x="90" y="594" font-size="24" fill="#7f93ad" font-family="Menlo, monospace">github.com/Xio-Shark/xioflow</text>
