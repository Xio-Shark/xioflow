  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#8ab4ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 96H1280M0 192H1280M0 288H1280M0 384H1280M0 480H1280M0 576H1280"/>
