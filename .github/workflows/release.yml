name: Release

# Tag-driven release.
#
# GitHub Release: always created from the tag (this is the repository's own
# release notes surface).
# npm publish: only when the repository variable NPM_TRUSTED_PUBLISHING_ENABLED
# is set to 'true'. That variable is flipped once, after the npm Trusted
# Publisher exists (npmjs.com -> package settings -> Trusted Publisher ->
# GitHub Actions: Xio-Shark / xioflow / release.yml, environment empty).
# Until then the publish job is skipped visibly, so a tag never ships an
# artifact that cannot be traced back to this repository.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:package

      - name: Report publish mode
        run: |
          if [ "${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}" = "true" ]; then
            echo "npm publish: enabled (trusted publishing + provenance)"
          else
            echo "npm publish: disabled — set repository variable NPM_TRUSTED_PUBLISHING_ENABLED=true after configuring the npm Trusted Publisher"
          fi

  publish-npm:
    needs: verify
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; fail loudly instead of
      # silently publishing an unsigned artifact.
      - name: Check npm CLI supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

      - run: pnpm install --frozen-lockfile
      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Verify published version and provenance attestation
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if metadata="$(npm view "@xioflow/kernel@$version" --json 2>/dev/null)"; then
              echo "$metadata" | node -e '
                const fs = require("fs");
                const info = JSON.parse(fs.readFileSync(0, "utf8"));
                const attestations = info.dist?.attestations;
                if (!attestations?.provenance) {
                  console.error("published version has no provenance attestation");
                  process.exit(1);
                }
                console.log(`provenance: ${JSON.stringify(attestations.provenance)}`);
              '
              echo "verified @xioflow/kernel@$version"
              exit 0
            fi
            echo "attempt $attempt/20: registry has not indexed $version yet; retrying in 30s"
            sleep 30
          done
          echo "::error::registry never exposed @xioflow/kernel@$version (index lag); re-run this job to verify"
          exit 1

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
