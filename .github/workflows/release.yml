name: Release

# Tag-driven release.
#
# GitHub Release: always created from the tag (this is the repository's own
# release notes surface).
# npm publish: only when the repository variable NPM_TRUSTED_PUBLISHING_ENABLED
# is set to 'true'. That variable is flipped once, after the npm Trusted
# Publisher exists (npmjs.com -> package settings -> Trusted Publisher ->
# GitHub Actions: Xio-Shark / xioflow / release.yml, environment empty).
# Until then the publish job is skipped visibly, so a tag never ships an
# artifact that cannot be traced back to this repository.
#
# Release assets: every release also carries the packed tarball, SHA256SUMS
# and a GitHub build provenance attestation for the tarball. A manual run
# (workflow_dispatch) re-verifies an existing tag and attaches missing assets;
# it never publishes to npm and never overwrites an asset that differs.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to verify and attach assets to (e.g. v0.1.5)'
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Check tag matches package version
        run: |
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $RELEASE_TAG does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm verify:package

      - name: Report publish mode
        run: |
          if [ "${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED }}" = "true" ]; then
            echo "npm publish: enabled (trusted publishing + provenance)"
          else
            echo "npm publish: disabled — set repository variable NPM_TRUSTED_PUBLISHING_ENABLED=true after configuring the npm Trusted Publisher"
          fi

  publish-npm:
    needs: verify
    if: github.event_name == 'push' && vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; fail loudly instead of
      # silently publishing an unsigned artifact.
      - name: Check npm CLI supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`);
              process.exit(1);
            }
          ' "$npm_version"

      - run: pnpm install --frozen-lockfile
      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Verify published version and provenance attestation
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if metadata="$(npm view "@xioflow/kernel@$version" --json 2>/dev/null)"; then
              echo "$metadata" | node -e '
                const fs = require("fs");
                const info = JSON.parse(fs.readFileSync(0, "utf8"));
                const attestations = info.dist?.attestations;
                if (!attestations?.provenance) {
                  console.error("published version has no provenance attestation");
                  process.exit(1);
                }
                console.log(`provenance: ${JSON.stringify(attestations.provenance)}`);
              '
              echo "verified @xioflow/kernel@$version"
              exit 0
            fi
            echo "attempt $attempt/20: registry has not indexed $version yet; retrying in 30s"
            sleep 30
          done
          echo "::error::registry never exposed @xioflow/kernel@$version (index lag); re-run this job to verify"
          exit 1

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # OIDC for the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create GitHub release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          notes_file="$(mktemp)"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            echo "no changelog section for $version; falling back to generated notes"
            rm "$notes_file"
            notes_file=""
          else
            printf '\n**Full changelog**: https://github.com/%s/blob/main/CHANGELOG.md\n' "$GITHUB_REPOSITORY" >> "$notes_file"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG exists; syncing notes"
            if [ -n "$notes_file" ]; then
              gh release edit "$RELEASE_TAG" --notes-file "$notes_file"
            fi
          else
            if [ -n "$notes_file" ]; then
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$notes_file"
            else
              gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
            fi
          fi

          if [ -n "$notes_file" ]; then
            rm "$notes_file"
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pack tarball and checksums
        run: |
          mkdir release-assets
          npm pack --pack-destination release-assets
          cd release-assets
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance for the tarball
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*.tgz

      - name: Attach assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          mkdir -p existing-assets
          for file in release-assets/*; do
            name="$(basename "$file")"
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir existing-assets --clobber
              if cmp -s "$file" "existing-assets/$name"; then
                echo "$name is already attached with identical content"
                continue
              fi
              echo "::error::$name is already attached with different content; a published asset is never overwritten"
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$file"
            echo "attached $name"
          done
